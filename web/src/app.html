<header class="masthead">
  <a href="/" aria-label="Vidoo ana sayfa">
    <span class="mark" aria-hidden="true">▶</span> Vidoo
  </a>
</header>

<main class="mx-auto max-w-[1100px] px-3.5 pt-7 pb-12 min-[691px]:px-6 min-[691px]:pt-10">
  <section class="intro">
    <h1>Aracınızın fotoğraflarını<br><em>ilan videosuna dönüştürün.</em></h1>
    <p>3–5 fotoğraf seçin, videonuzu ücretsiz izleyin. Beğenirseniz tek ödeme ile filigransız MP4’ü indirin.</p>
  </section>
  <div class="mt-7 grid grid-cols-1 items-start gap-4 min-[691px]:grid-cols-[minmax(0,1.2fr)_minmax(0,1fr)]">
    <vidoo-photo-upload class="block min-w-0" (previewCreated)="preview.reveal()" />
    <vidoo-video-preview #preview class="block min-w-0" />
  </div>
</main>
